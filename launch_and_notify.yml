name: Launch Campaign (Notify & Go Live)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Notification Email with Schedule
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python notify.py

      - name: 10-Minute Safety Buffer
        run: |
          echo "Notification email sent to user."
          echo "Waiting 10 minutes (600 seconds) before arming GO_LIVE.txt..."
          echo "To prevent launch, create/commit HOLD.txt to the repository now."
          sleep 600

      - name: Check HOLD Gate and Create GO_LIVE.txt
        run: |
          git pull --rebase
          if [ -f "HOLD.txt" ]; then
            echo "ABORT: HOLD.txt detected in the repository! Refusing to create GO_LIVE.txt."
            exit 0
          fi

          echo "HOLD.txt not present. Creating GO_LIVE.txt..."
          echo "Campaign activated at $(date -u)" > GO_LIVE.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add GO_LIVE.txt
          git commit -m "Arm automated publisher: create GO_LIVE.txt [skip ci]"
          git push
          echo "GO_LIVE.txt committed and pushed. Unattended publishing is now LIVE!"
